services:
  clamav:
    image: clamav/clamav:1.4-stable
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s   # first boot downloads signature DBs — can take a while

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
    env_file:
      - .env
    depends_on:
      clamav:
        condition: service_healthy

volumes:
  clamav-db:
